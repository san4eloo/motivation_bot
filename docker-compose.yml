services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: schedule_bot
      POSTGRES_USER: schedule_bot
      POSTGRES_PASSWORD: "1234"

    ports:
      - "5433:5432"

    volumes:
      - schedule_bot_pgdata:/var/lib/postgresql/data

volumes:
  schedule_bot_pgdata: